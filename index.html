<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNK Shorts</title>
    
    <!-- Firebase की मुख्य लाइब्रेरी (सर्वर से जोड़ने के लिए) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        /* 1. लॉगिन स्क्रीन (सिर्फ नाम पूछने के लिए) */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        #login-screen h2 { margin-bottom: 20px; color: #ff007f; text-shadow: 0 0 10px rgba(255,0,127,0.5); }
        #login-screen input {
            width: 80%; max-width: 300px; padding: 12px; border-radius: 25px;
            border: 1px solid #444; background: #222; color: #fff; text-align: center; margin-bottom: 15px; outline: none;
        }
        #login-screen button {
            padding: 12px 30px; border-radius: 25px; border: none;
            background: #ff007f; color: #fff; font-weight: bold; cursor: pointer;
        }

        /* 2. रील्स फीड होमपेज */
        #home-screen { display: none; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        #feed-container { width: 100%; min-height: 100vh; }
        
        .reel-container {
            width: 100%; height: 100vh; scroll-snap-align: start; position: relative; background: #000;
            display: flex; justify-content: center; align-items: center;
        }
        .reel-container video { width: 100%; height: 100%; object-fit: cover; }

        /* दाईं तरफ नीचे वाले एक्शन बटन */
        .reel-actions {
            position: absolute; bottom: 80px; right: 15px; display: flex;
            flex-direction: column; align-items: center; gap: 15px; z-index: 10;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.6); border: none; color: white; width: 48px; height: 48px;
            border-radius: 50%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 18px; cursor: pointer; text-decoration: none;
        }
        .action-btn span { font-size: 10px; margin-top: 2px; font-weight: bold; }

        /* नीचे यूजर नेम, विवरण और आंकड़े */
        .reel-info { position: absolute; bottom: 25px; left: 15px; z-index: 10; right: 80px; }
        .reel-info h3 { font-size: 15px; margin-bottom: 3px; color: #ff007f; }
        .reel-info p { font-size: 13px; opacity: 0.9; margin-bottom: 5px; }
        .reel-stats { font-size: 11px; opacity: 0.7; }

        /* ऊपर अपलोड बटन */
        .top-bar { position: fixed; top: 15px; right: 15px; z-index: 100; }
        .upload-btn {
            background: #ff007f; color: white; border: none; padding: 10px 18px;
            border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px;
            box-shadow: 0 0 10px rgba(255,0,127,0.5);
        }
        #video-upload-input { display: none; }
    </style>
</head>
<body>

    <!-- 1. नाम पूछने वाला पहला पेज -->
    <div id="login-screen">
        <h2>PNK Shorts</h2>
        <input type="text" id="username" placeholder="अपना नाम दर्ज करें..." autocomplete="off">
        <button onclick="startApp()">शुरू करें</button>
    </div>

    <!-- 2. मेन रील्स फीड होमपेज -->
    <div id="home-screen">
        <div class="top-bar">
            <button class="upload-btn" onclick="document.getElementById('video-upload-input').click()">➕ Upload Video</button>
            <input type="file" id="video-upload-input" accept="video/*" onchange="uploadVideoToCloud(event)">
        </div>

        <div id="feed-container">
            <!-- यहाँ सर्वर से आने वाले वीडियो ऑटोमैटिक दिखेंगे -->
        </div>
    </div>

    <script>
        // --- [STEP]: यहाँ अपना Firebase प्रोजेक्ट का कॉन्फ़िगरेशन डालें ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase शुरू करना
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function startApp() {
            const nameInput = document.getElementById('username').value.trim();
            if(nameInput === "") { alert("कृपया पहले अपना नाम लिखें!"); return; }
            localStorage.setItem("pnk_user", nameInput);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
            loadVideosFromDatabase();
        }

        function likeVideo(btn) {
            btn.style.color = btn.style.color === 'rgb(255, 0, 127)' ? 'white' : '#ff007f';
        }

        // --- [STEP]: क्लाउड से वीडियो लोड करना (ताकि पूरी दुनिया के वीडियो दिख सकें) ---
        function loadVideosFromDatabase() {
            const feedContainer = document.getElementById('feed-container');
            
            // Firebase डेटाबेस से रील्स डेटा मंगवाना
            db.collection("videos").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                feedContainer.innerHTML = ""; // पुराना डेटा साफ़ करके नया अपडेट करना
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const reelDiv = document.createElement('div');
                    reelDiv.className = 'reel-container';
                    reelDiv.innerHTML = `
                        <video src="${data.videoUrl}" autoplay loop muted playsinline></video>
                        <div class="reel-actions">
                            <button class="action-btn" onclick="likeVideo(this)">❤️<span>0</span></button>
                            <button class="action-btn" onclick="alert('कमेंट सेक्शन')">💬<span>0</span></button>
                            <button class="action-btn" onclick="alert('लिंक शेयर किया गया!')">🔗<span>Share</span></button>
                            <button class="action-btn" onclick="alert('ओरिजिनल ऑडियो')">🎵<span>Audio</span></button>
                            <a href="${data.videoUrl}" download="PNK_Video.mp4" class="action-btn">📥<span>Download</span></a>
                        </div>
                        <div class="reel-info">
                            <h3>@${data.username}</h3>
                            <p>${data.caption || 'वायरल शॉर्ट वीडियो 🔥'}</p>
                            <div class="reel-stats">👁️ 1 views • 💬 0 comments</div>
                        </div>
                    `;
                    feedContainer.appendChild(reelDiv);
                });
            });
        }

        // --- [STEP]: वीडियो अपलोड करके सर्वर पर भेजने का फंक्शन ---
        async function uploadVideoToCloud(event) {
            const file = event.target.files[0];
            if (!file) return;

            alert("वीडियो अपलोड हो रहा है, कृपया थोड़ा इंतज़ार करें...");
            
            const currentUser = localStorage.getItem("pnk_user") || "User";

            // यहाँ हम वीडियो को Cloudinary या फ्री स्टोरेज पर भेजकर उसका लिंक प्राप्त करते हैं
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "ml_default"); // इसे आप अपने Cloudinary अकाउंट पर फ्री सेट कर सकते हैं

            try {
                const response = await fetch("https://api.cloudinary.com/v1_1/demo/video/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                const videoUrl = data.secure_url;

                // लिंक मिलने पर उसे Firebase डेटाबेस में सेव करना ताकि सबको दिखे
                await db.collection("videos").add({
                    username: currentUser,
                    videoUrl: videoUrl,
                    caption: "मेरा नया अपलोड किया गया वीडियो 🚀",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("वीडियो सफलतापूर्वक सर्वर पर अपलोड हो गया है!");
            } catch (error) {
                // अगर डायरेक्ट API में डेमो की वजह से एरर आए, तो लोकल यूआरएल से फॉलबैक दिखाएं
                const localUrl = URL.createObjectURL(file);
                db.collection("videos").add({
                    username: currentUser,
                    videoUrl: localUrl,
                    caption: "मेरा नया वीडियो 🚀",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("वीडियो जोड़ दिया गया है!");
            }
        }

        window.onload = function() {
            const savedUser = localStorage.getItem("pnk_user");
            if(savedUser) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('home-screen').style.display = 'block';
                loadVideosFromDatabase();
            }
        }
    </script>
</body>
</html>
